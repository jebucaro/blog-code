    <script type=&quot;application/hyperframes-slideshow+json&quot;>
{
  &quot;slides&quot;: [
    {
      &quot;sceneId&quot;: &quot;s01-portada&quot;,
      &quot;notes&quot;: &quot;[BLOQUE 1 · APERTURA ≈5 min]\n\n\&quot;Buenas, gracias por estar aquí. Hoy no vengo a venderles el framework de agentes más nuevo ni a pedirles que reescriban su stack. Vengo a hablarles de algo que ya tienen en su laptop: esos scripts y CLIs que usan todos los días, y de cómo enseñarle a un agente de IA a usarlos de forma correcta y repetible.\&quot;\n\nHilo conductor: No necesitas un MCP ni un framework gigante para que la IA te ayude en producción. Necesitas herramientas deterministas y un buen manual para el agente.&quot;
    },
    {
      &quot;sceneId&quot;: &quot;s01b-patrocinadores&quot;,
      &quot;notes&quot;: &quot;\&quot;Antes de empezar, un agradecimiento a los patrocinadores que hacen posible el AWS Community Day Guatemala: Universidad Landívar, AWS, Banco Industrial, JetBrains, GBM, proticket.io, HTEC e Improving. Gracias por apoyar a la comunidad.\&quot;&quot;
    },
    {
      &quot;sceneId&quot;: &quot;s02-fomo&quot;,
      &quot;notes&quot;: &quot;\&quot;Levanten la mano con honestidad: ¿quién ha sentido en los últimos meses que si no está construyendo un servidor MCP o montando un framework de agentes, ya se quedó atrás?\&quot; [pausa, contar manos]\n\n\&quot;Tranquilos, no están solos. Cada semana sale algo nuevo, y es fácil sentir que lo que sabemos hacer ya no sirve. Spoiler: sí sirve, y mucho.\&quot;\n\nNOTA: Deja que la audiencia responda. Si muchos levantan la mano, úsalo: \&quot;Perfecto, esta charla es para ustedes\&quot;.&quot;
    },
    {
      &quot;sceneId&quot;: &quot;s03-realidad&quot;,
      &quot;notes&quot;: &quot;\&quot;Segunda pregunta. Cuando producción se cae, cuando hay que dar soporte rápido o cuando el jefe pide un reporte que la plataforma no genera... ¿qué es lo primero que hacemos?\&quot;\n\n[esperar respuestas: 'reviso logs', 'abro la consola', 'corro un query', 'hago un script'] → AVANZA para mostrar las respuestas.\n\n\&quot;Exacto. Nadie dice 'voy a construir un servidor MCP'. Abrimos la terminal, corremos un query, armamos un script rápido en Python o Bash.\&quot;&quot;,
      &quot;fragments&quot;: [
        13.5,
        14.5
      ]
    },
    {
      &quot;sceneId&quot;: &quot;s04-antipatron&quot;,
      &quot;notes&quot;: &quot;\&quot;Y cuando metemos IA, normalmente pasa esto: copiamos logs, pegamos un CSV, le pedimos al modelo que 'genere el reporte' o 'encuentre el error'. El modelo hace su mejor esfuerzo con lo que le dimos... que casi siempre es incompleto.\&quot;\n\nAVANZA → etiquetas rojas.\n\n\&quot;Y lo peor: si mañana pedimos lo mismo, el resultado puede ser distinto. Le estamos pidiendo al modelo que *calcule* cosas que deberían estar *programadas*.\&quot;&quot;,
      &quot;fragments&quot;: [
        16.5,
        17.5
      ]
    },
    {
      &quot;sceneId&quot;: &quot;s05-idea&quot;,
      &quot;notes&quot;: &quot;\&quot;Esta es la idea de toda la charla: dejemos que el modelo haga lo que hace bien, entender la intención, decidir e interpretar, y que nuestros scripts hagan lo que hacen bien: ejecutar exactamente lo mismo cada vez.\&quot;\n\nAVANZA → diagrama. AVANZA → SKILL.md.\n\n\&quot;El puente entre ambos es un skill: un archivo markdown que le enseña al agente cuándo y cómo usar tu herramienta. Sin servidores, sin infraestructura nueva. Tu script de siempre, más un buen manual.\&quot;&quot;,
      &quot;fragments&quot;: [
        19.5,
        20.5,
        21.5
      ]
    },
    {
      &quot;sceneId&quot;: &quot;s06-pilares&quot;,
      &quot;notes&quot;: &quot;[BLOQUE 2 · LOS 4 PILARES ≈5 min]\n\n\&quot;Para llegar ahí propongo cuatro pasos.\&quot; (AVANZA en cada pilar)\n\n1. \&quot;Primero, hacer la herramienta determinista: nada de valores quemados en el código.\&quot;\n2. \&quot;Segundo, definir el trigger semántico: explicarle al agente en lenguaje claro cuándo debe usarla.\&quot;\n3. \&quot;Tercero, mostrarle el camino con ejemplos concretos.\&quot;\n4. \&quot;Y cuarto, empaquetar todo en un SKILL.md. Vamos uno por uno.\&quot;&quot;,
      &quot;fragments&quot;: [
        23.5,
        24.5,
        25.5,
        26.5,
        27.5
      ]
    },
    {
      &quot;sceneId&quot;: &quot;s07-antes-despues&quot;,
      &quot;notes&quot;: &quot;\&quot;Todos tenemos este script. El que tiene el host de producción quemado y el user_id que cambiamos a mano cada vez. Funciona para nosotros, pero un agente no puede usarlo con seguridad.\&quot;\n\nAVANZA → Después.\n\n\&quot;A la derecha está la misma lógica convertida en una herramienta: parámetros explícitos, ambiente explícito, formato de salida explícito. Ese pequeño cambio es el 80% del trabajo.\&quot;&quot;,
      &quot;fragments&quot;: [
        29.5,
        30.5
      ]
    },
    {
      &quot;sceneId&quot;: &quot;s10-casos-uso&quot;,
      &quot;notes&quot;: &quot;[BLOQUE 3 · DEEP DIVE ≈12 min]\n\n\&quot;Antes de escribir una sola línea de código, la guía de Anthropic recomienda definir dos o tres casos de uso concretos: qué diría el usuario, qué pasos hay que seguir y cuál es el resultado esperado.\&quot;\n\n\&quot;Esto les da gratis los insumos de los cuatro pilares: los parámetros de los pasos se vuelven flags, las frases del usuario se vuelven el trigger, y los pasos se vuelven los ejemplos.\&quot;\n\n\&quot;La guía distingue dos formas de pensar un skill: problem-first, donde el usuario describe un resultado y el skill orquesta las herramientas, y tool-first, donde la herramienta ya existe y el skill aporta la experiencia para usarla bien. Un skill para su CLI es tool-first: el script ya lo tienen, lo que falta es enseñarle al agente a usarlo.\&quot;&quot;
    },
    {
      &quot;sceneId&quot;: &quot;s08-determinista&quot;,
      &quot;notes&quot;: &quot;\&quot;¿Qué hace que un CLI sea bueno para un agente? Curiosamente, lo mismo que lo hace bueno para un humano en un pipeline. Flags explícitos, salida en JSON para que el agente no tenga que adivinar parseando texto, errores que digan qué valores sí acepta para que corrija sin adivinar, y exit codes que digan si algo falló.\&quot;\n\nAVANZA → las dos que la gente olvida.\n\n\&quot;Dos que la gente olvida: no pongan prompts interactivos, porque el agente se queda colgado esperando, y para cualquier cosa que borre o modifique, --dry-run. Ustedes no quieren que un agente haga un DELETE en producción por un malentendido.\&quot;&quot;,
      &quot;fragments&quot;: [
        36.5,
        37.5
      ]
    },
    {
      &quot;sceneId&quot;: &quot;s09-herramientas&quot;,
      &quot;notes&quot;: &quot;\&quot;No tienen que escribir el parsing a mano. En Python, Typer les genera el CLI a partir de los type hints de una función; Click si quieren más control; argparse si no quieren dependencias. En Node, Commander para casi todo y oclif si el CLI va a crecer mucho.\&quot;\n\n\&quot;Ojo: estas librerías son dependencias de su proyecto, van en el pyproject.toml o el package.json, nunca instaladas globalmente. Lo que sí se instala como herramienta es su CLI: con uvx o npx el agente puede ejecutarla sin instalación previa, y con uv tool install o npm i -g queda disponible en el PATH, cada una con sus dependencias aisladas.\&quot;&quot;
    },
    {
      &quot;sceneId&quot;: &quot;s11-trigger&quot;,
      &quot;notes&quot;: &quot;\&quot;El segundo pilar es el más subestimado. Un agente con varias skills disponibles decide cuál usar leyendo una descripción corta. No lee su código, no adivina. Si la descripción dice 'herramienta de reportes', el agente no tiene idea de cuándo aplica.\&quot;\n\nAVANZA → la buena.\n\n\&quot;La buena descripción responde dos preguntas: qué hace y cuándo usarla, con las palabras que un usuario realmente diría: 'reporte', 'ventas del mes', 'cliente'.\&quot;&quot;,
      &quot;fragments&quot;: [
        43.5,
        44.5
      ]
    },
    {
      &quot;sceneId&quot;: &quot;s12-frontmatter&quot;,
      &quot;notes&quot;: &quot;\&quot;La guía de Anthropic es muy concreta aquí. La descripción tiene que decir qué hace y cuándo usarla, idealmente con las frases exactas que diría un usuario. Tiene un límite de 1024 caracteres y no admite símbolos de menor o mayor, porque ese texto termina en el system prompt del agente y podría usarse para inyectar instrucciones.\&quot;\n\n\&quot;El nombre va en kebab-case y debe coincidir con la carpeta. Y si su skill se activa cuando no debe, agreguen triggers negativos: díganle explícitamente cuándo NO usarla.\&quot;\n\nAVANZA → ejemplos malos de la guía.\n\n\&quot;Piénsenlo como el SEO de su herramienta, pero para un agente.\&quot;&quot;,
      &quot;fragments&quot;: [
        46.5,
        47.5
      ]
    },
    {
      &quot;sceneId&quot;: &quot;s13-ejemplos&quot;,
      &quot;notes&quot;: &quot;\&quot;Tercer pilar: ejemplos. Los modelos aprenden muchísimo de ejemplos concretos. No basta con documentar los flags; muéstrenle la petición del usuario, el comando exacto y cómo se ve la salida.\&quot;\n\n\&quot;Así el agente sabe qué esperar y puede detectar cuando algo salió mal. Dos o tres ejemplos bien escogidos valen más que diez páginas de documentación.\&quot;&quot;
    },
    {
      &quot;sceneId&quot;: &quot;s14-troubleshooting&quot;,
      &quot;notes&quot;: &quot;\&quot;Y no se olviden del camino triste. La guía propone un formato simple: error, causa, solución. ¿Qué hace el agente si el usuario no existe? ¿Si producción no responde? Ese conocimiento lo tienen ustedes de las veces que el script falló a las 3 de la mañana.\&quot;\n\nAVANZA → la frase.\n\n\&quot;Y hay una frase de la guía que resume toda esta charla: el código es determinista, la interpretación del lenguaje no. Por eso Anthropic recomienda que las validaciones críticas no se dejen como instrucciones en texto, sino como un script que las haga. Eso es exactamente el pilar 1.\&quot;\n\n\&quot;Un detalle más de la guía: cuando el agente no sigue las instrucciones, casi siempre es porque son muy largas, ambiguas o están enterradas. Lo crítico va arriba, en pocas líneas.\&quot;\n\nNOTA: Esta slide conecta el pilar 3 con el pilar 1; buen momento para pausar.&quot;,
      &quot;fragments&quot;: [
        53.5,
        54.5
      ]
    },
    {
      &quot;sceneId&quot;: &quot;s15-anatomia&quot;,
      &quot;notes&quot;: &quot;\&quot;El cuarto pilar es empaquetar. Un skill es simplemente una carpeta con un SKILL.md. Arriba, un frontmatter YAML con name y description, que es el trigger que vimos. Abajo, instrucciones en markdown. Opcionalmente, carpetas para scripts, documentación de referencia y assets.\&quot;\n\n\&quot;¿Y dónde vive esa carpeta? El agente la busca en un lugar fijo: dentro de .claude/skills para Claude Code o .kiro/skills para Kiro. Si la ponen en el proyecto, el skill solo existe ahí y viaja con el repo para todo el equipo; si la ponen en su carpeta personal, en ~/.claude/skills o ~/.kiro/skills, la tienen disponible en todos sus proyectos.\&quot;\n\nAVANZA → reglas críticas.\n\n\&quot;Ojo con los detalles que más fallan: el archivo se llama exactamente SKILL.md en mayúsculas, la carpeta en kebab-case, y no pongan un README dentro del skill: toda la documentación va en el SKILL.md o en references. El README va en la raíz del repo, para los humanos.\&quot;\n\n\&quot;Para CLIs, el campo compatibility es útil para declarar requisitos: 'requiere Python 3.11 y acceso a red'.\&quot;&quot;,
      &quot;fragments&quot;: [
        56.5,
        57.5
      ]
    },
    {
      &quot;sceneId&quot;: &quot;s16-progressive&quot;,
      &quot;notes&quot;: &quot;\&quot;¿Por qué esto escala mejor que meter todo en el prompt? Por algo que se llama progressive disclosure.\&quot;\n\nAVANZA (nivel 1) \&quot;El agente solo tiene cargado el nombre y la descripción de cada skill: lo justo para decidir si aplica, sin cargar todo lo demás.\&quot;\nAVANZA (nivel 2) \&quot;Cuando decide usar una, lee el SKILL.md completo.\&quot;\nAVANZA (nivel 3) \&quot;Y si necesita más detalle, abre un archivo de referencia. Los scripts ni siquiera entran al contexto: se ejecutan y solo regresa la salida.\&quot;\n\n\&quot;Por eso pueden tener decenas de skills instaladas; la guía sugiere mantener el SKILL.md por debajo de cinco mil palabras y mover el detalle a references. Y algo importante: Anthropic publicó Agent Skills como estándar abierto, igual que hizo con MCP, así que el mismo skill está pensado para funcionar en otras plataformas.\&quot;\n\nNOTA: Si mencionas qué otras herramientas ya adoptaron el estándar, verifica la lista actual antes de la charla.&quot;,

      &quot;notes&quot;: &quot;[BLOQUE 4 · DEMO POKECLI ≈6 min]\n\n\&quot;Hace un tiempo di una charla interna en el trabajo sobre esto mismo. La idea conectó, pero la respuesta me dejó algo claro: necesitaba un ejemplo práctico que la gente pudiera revisar y reutilizar. Ese ejemplo es pokecli.\&quot;\n\n\&quot;Es un CLI en Python, con Typer, que consulta PokéAPI. Es sencillo a propósito: si entienden el patrón con Pokémon, lo pueden aplicar a su base de datos, a sus logs o a su API interna.\&quot;\n\n\&quot;Y fíjense en la instalación: pokecli install --skills no genera nada, copia el skill que ya viene dentro del paquete a la carpeta donde el agente lo espera. Nadie necesita clonar el repo, la herramienta instalada trae su propia capa para agentes.\&quot;\n\n\&quot;Por defecto lo instala para Claude Code en su carpeta personal. Con --agent kiro lo instala para Kiro, y con --local queda solo en el proyecto donde están parados.\&quot;&quot;

      &quot;notes&quot;: &quot;GUION DE LA DEMO\n1. Muestra primero el CLI solo en la terminal: pokecli --help y pokecli get pokemon pikachu. Señala la salida TOON y las pistas help[] al final, que le sugieren al agente el siguiente comando. \&quot;Esto funciona sin IA. Es una herramienta normal.\&quot;\n2. Abre el agente y lanza el prompt 1. Señala el momento en que DECIDE usar el skill y corre pokecli get pokemon gengar y pokecli get type ghost.\n3. Prompt 2: el agente corre pokecli get pokemon dos veces y luego interpreta los resultados.\n4. Prompt 3: el agente combina get type, moves y can-learn para algo que el CLI no hace por sí solo.\nEXTRA (si hay tiempo): can-learn responde con el exit code, if pokecli can-learn charizard fly; then echo \&quot;sí\&quot;; fi\n\nSPEECH (durante la demo)\n\&quot;Fíjense: yo no le dije 'usa pokecli'. Le pregunté en lenguaje natural, leyó la descripción, decidió que este skill aplicaba, corrió el comando y me respondió con datos reales, no con lo que recuerda de su entrenamiento. Y en el tercer ejemplo pasa algo interesante: el CLI no sabe armar equipos. El agente sí. El agente decide. El script ejecuta.\&quot;\n\nPLAN B: Graba la demo en video por si falla el internet o la API. Ten capturas listas.&quot;

      <script type="application/hyperframes-slideshow+json">
{
  "slides": [
    {
      "sceneId": "s01-portada",
      "notes": "[BLOQUE 1 · APERTURA ≈5 min]\n\n\"Buenas, gracias por estar aquí. Hoy no vengo a venderles el framework de agentes más nuevo ni a pedirles que reescriban su stack. Vengo a hablarles de algo que ya tienen en su laptop: esos scripts y CLIs que usan todos los días, y de cómo enseñarle a un agente de IA a usarlos de forma correcta y repetible.\"\n\nHilo conductor: No necesitas un MCP ni un framework gigante para que la IA te ayude en producción. Necesitas herramientas deterministas y un buen manual para el agente."
    },
    {
      "sceneId": "s01b-patrocinadores",
      "notes": "\"Antes de empezar, un agradecimiento a los patrocinadores que hacen posible el AWS Community Day Guatemala: Universidad Landívar, AWS, Banco Industrial, JetBrains, GBM, proticket.io, HTEC e Improving. Gracias por apoyar a la comunidad.\""
    },
    {
      "sceneId": "s02-fomo",
      "notes": "\"Levanten la mano con honestidad: ¿quién ha sentido en los últimos meses que si no está construyendo un servidor MCP o montando un framework de agentes, ya se quedó atrás?\" [pausa, contar manos]\n\n\"Tranquilos, no están solos. Cada semana sale algo nuevo, y es fácil sentir que lo que sabemos hacer ya no sirve. Spoiler: sí sirve, y mucho.\"\n\nNOTA: Deja que la audiencia responda. Si muchos levantan la mano, úsalo: \"Perfecto, esta charla es para ustedes\"."
    },
    {
      "sceneId": "s03-realidad",
      "notes": "\"Segunda pregunta. Cuando producción se cae, cuando hay que dar soporte rápido o cuando el jefe pide un reporte que la plataforma no genera... ¿qué es lo primero que hacemos?\"\n\n[esperar respuestas: 'reviso logs', 'abro la consola', 'corro un query', 'hago un script'] → AVANZA para mostrar las respuestas.\n\n\"Exacto. Nadie dice 'voy a construir un servidor MCP'. Abrimos la terminal, corremos un query, armamos un script rápido en Python o Bash.\"",
      "fragments": [
        13.5,
        14.5
      ]
    },
    {
      "sceneId": "s04-antipatron",
      "notes": "\"Y cuando metemos IA, normalmente pasa esto: copiamos logs, pegamos un CSV, le pedimos al modelo que 'genere el reporte' o 'encuentre el error'. El modelo hace su mejor esfuerzo con lo que le dimos... que casi siempre es incompleto.\"\n\nAVANZA → etiquetas rojas.\n\n\"Y lo peor: si mañana pedimos lo mismo, el resultado puede ser distinto. Le estamos pidiendo al modelo que *calcule* cosas que deberían estar *programadas*.\"",
      "fragments": [
        16.5,
        17.5
      ]
    },
    {
      "sceneId": "s05-idea",
      "notes": "\"Esta es la idea de toda la charla: dejemos que el modelo haga lo que hace bien, entender la intención, decidir e interpretar, y que nuestros scripts hagan lo que hacen bien: ejecutar exactamente lo mismo cada vez.\"\n\nAVANZA → diagrama. AVANZA → SKILL.md.\n\n\"El puente entre ambos es un skill: un archivo markdown que le enseña al agente cuándo y cómo usar tu herramienta. Sin servidores, sin infraestructura nueva. Tu script de siempre, más un buen manual.\"",
      "fragments": [
        19.5,
        20.5,
        21.5
      ]
    },
    {
      "sceneId": "s06-pilares",
      "notes": "[BLOQUE 2 · LOS 4 PILARES ≈5 min]\n\n\"Para llegar ahí propongo cuatro pasos.\" (AVANZA en cada pilar)\n\n1. \"Primero, hacer la herramienta determinista: nada de valores quemados en el código.\"\n2. \"Segundo, definir el trigger semántico: explicarle al agente en lenguaje claro cuándo debe usarla.\"\n3. \"Tercero, mostrarle el camino con ejemplos concretos.\"\n4. \"Y cuarto, empaquetar todo en un SKILL.md. Vamos uno por uno.\"",
      "fragments": [
        23.5,
        24.5,
        25.5,
        26.5,
        27.5
      ]
    },
    {
      "sceneId": "s07-antes-despues",
      "notes": "\"Todos tenemos este script. El que tiene el host de producción quemado y el user_id que cambiamos a mano cada vez. Funciona para nosotros, pero un agente no puede usarlo con seguridad.\"\n\nAVANZA → Después.\n\n\"A la derecha está la misma lógica convertida en una herramienta: parámetros explícitos, ambiente explícito, formato de salida explícito. Ese pequeño cambio es el 80% del trabajo.\"",
      "fragments": [
        29.5,
        30.5
      ]
    },
    {
      "sceneId": "s10-casos-uso",
      "notes": "[BLOQUE 3 · DEEP DIVE ≈12 min]\n\n\"Antes de escribir una sola línea de código, la guía de Anthropic recomienda definir dos o tres casos de uso concretos: qué diría el usuario, qué pasos hay que seguir y cuál es el resultado esperado.\"\n\n\"Esto les da gratis los insumos de los cuatro pilares: los parámetros de los pasos se vuelven flags, las frases del usuario se vuelven el trigger, y los pasos se vuelven los ejemplos.\"\n\n\"La guía distingue dos formas de pensar un skill: problem-first, donde el usuario describe un resultado y el skill orquesta las herramientas, y tool-first, donde la herramienta ya existe y el skill aporta la experiencia para usarla bien. Un skill para su CLI es tool-first: el script ya lo tienen, lo que falta es enseñarle al agente a usarlo.\""
    },
    {
      "sceneId": "s08-determinista",
      "notes": "\"¿Qué hace que un CLI sea bueno para un agente? Curiosamente, lo mismo que lo hace bueno para un humano en un pipeline. Flags explícitos, salida en JSON para que el agente no tenga que adivinar parseando texto, errores que digan qué valores sí acepta para que corrija sin adivinar, y exit codes que digan si algo falló.\"\n\nAVANZA → las dos que la gente olvida.\n\n\"Dos que la gente olvida: no pongan prompts interactivos, porque el agente se queda colgado esperando, y para cualquier cosa que borre o modifique, --dry-run. Ustedes no quieren que un agente haga un DELETE en producción por un malentendido.\"",
      "fragments": [
        36.5,
        37.5
      ]
    },
    {
      "sceneId": "s09-herramientas",
      "notes": "\"No tienen que escribir el parsing a mano. En Python, Typer les genera el CLI a partir de los type hints de una función; Click si quieren más control; argparse si no quieren dependencias. En Node, Commander para casi todo y oclif si el CLI va a crecer mucho.\"\n\n\"Ojo: estas librerías son dependencias de su proyecto, van en el pyproject.toml o el package.json, nunca instaladas globalmente. Lo que sí se instala como herramienta es su CLI: con uvx o npx el agente puede ejecutarla sin instalación previa, y con uv tool install o npm i -g queda disponible en el PATH, cada una con sus dependencias aisladas.\""
    },
    {
      "sceneId": "s11-trigger",
      "notes": "\"El segundo pilar es el más subestimado. Un agente con varias skills disponibles decide cuál usar leyendo una descripción corta. No lee su código, no adivina. Si la descripción dice 'herramienta de reportes', el agente no tiene idea de cuándo aplica.\"\n\nAVANZA → la buena.\n\n\"La buena descripción responde dos preguntas: qué hace y cuándo usarla, con las palabras que un usuario realmente diría: 'reporte', 'ventas del mes', 'cliente'.\"",
      "fragments": [
        43.5,
        44.5
      ]
    },
    {
      "sceneId": "s12-frontmatter",
      "notes": "\"La guía de Anthropic es muy concreta aquí. La descripción tiene que decir qué hace y cuándo usarla, idealmente con las frases exactas que diría un usuario. Tiene un límite de 1024 caracteres y no admite símbolos de menor o mayor, porque ese texto termina en el system prompt del agente y podría usarse para inyectar instrucciones.\"\n\n\"El nombre va en kebab-case y debe coincidir con la carpeta. Y si su skill se activa cuando no debe, agreguen triggers negativos: díganle explícitamente cuándo NO usarla.\"\n\nAVANZA → ejemplos malos de la guía.\n\n\"Piénsenlo como el SEO de su herramienta, pero para un agente.\"",
      "fragments": [
        46.5,
        47.5
      ]
    },
    {
      "sceneId": "s13-ejemplos",
      "notes": "\"Tercer pilar: ejemplos. Los modelos aprenden muchísimo de ejemplos concretos. No basta con documentar los flags; muéstrenle la petición del usuario, el comando exacto y cómo se ve la salida.\"\n\n\"Así el agente sabe qué esperar y puede detectar cuando algo salió mal. Dos o tres ejemplos bien escogidos valen más que diez páginas de documentación.\""
    },
    {
      "sceneId": "s14-troubleshooting",
      "notes": "\"Y no se olviden del camino triste. La guía propone un formato simple: error, causa, solución. ¿Qué hace el agente si el usuario no existe? ¿Si producción no responde? Ese conocimiento lo tienen ustedes de las veces que el script falló a las 3 de la mañana.\"\n\nAVANZA → la frase.\n\n\"Y hay una frase de la guía que resume toda esta charla: el código es determinista, la interpretación del lenguaje no. Por eso Anthropic recomienda que las validaciones críticas no se dejen como instrucciones en texto, sino como un script que las haga. Eso es exactamente el pilar 1.\"\n\n\"Un detalle más de la guía: cuando el agente no sigue las instrucciones, casi siempre es porque son muy largas, ambiguas o están enterradas. Lo crítico va arriba, en pocas líneas.\"\n\nNOTA: Esta slide conecta el pilar 3 con el pilar 1; buen momento para pausar.",
      "fragments": [
        53.5,
        54.5
      ]
    },
    {
      "sceneId": "s15-anatomia",
      "notes": "\"El cuarto pilar es empaquetar. Un skill es simplemente una carpeta con un SKILL.md. Arriba, un frontmatter YAML con name y description, que es el trigger que vimos. Abajo, instrucciones en markdown. Opcionalmente, carpetas para scripts, documentación de referencia y assets.\"\n\n\"¿Y dónde vive esa carpeta? El agente la busca en un lugar fijo: dentro de .claude/skills para Claude Code o .kiro/skills para Kiro. Si la ponen en el proyecto, el skill solo existe ahí y viaja con el repo para todo el equipo; si la ponen en su carpeta personal, en ~/.claude/skills o ~/.kiro/skills, la tienen disponible en todos sus proyectos.\"\n\nAVANZA → reglas críticas.\n\n\"Ojo con los detalles que más fallan: el archivo se llama exactamente SKILL.md en mayúsculas, la carpeta en kebab-case, y no pongan un README dentro del skill: toda la documentación va en el SKILL.md o en references. El README va en la raíz del repo, para los humanos.\"\n\n\"Para CLIs, el campo compatibility es útil para declarar requisitos: 'requiere Python 3.11 y acceso a red'.\"",
      "fragments": [
        56.5,
        57.5
      ]
    },
    {
      "sceneId": "s16-progressive",
